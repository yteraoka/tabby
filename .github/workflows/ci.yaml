name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Test
        run: swift test

  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # リリースと同じ手順で、ad-hoc 署名のユニバーサルな zip を作る
      - name: Build release zip
        id: build
        run: |
          version="$(sed -n 's/.*current = "\(.*\)"/\1/p' Sources/Taffy/Version.swift)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          scripts/release.sh "${version}"

      # 最新の Homebrew で cask を読み込み、非推奨の書き方などの警告が出ないことを確認する
      - name: Check cask template
        env:
          HOMEBREW_NO_ANALYTICS: "1"
        run: |
          brew update --quiet
          brew tap-new --no-git local/taffy
          tap_dir="$(brew --repository)/Library/Taps/local/homebrew-taffy"
          mkdir -p "${tap_dir}/Casks"
          scripts/cask.sh "${{ steps.build.outputs.version }}" "${{ steps.build.outputs.sha256 }}" > "${tap_dir}/Casks/taffy.rb"
          brew info --cask local/taffy/taffy 2>&1 | tee "${RUNNER_TEMP}/brew-info.log"
          if grep -q -i "warning\|error" "${RUNNER_TEMP}/brew-info.log"; then
            echo "::error::brew が cask について警告を出しました"
            exit 1
          fi
          brew style --cask local/taffy/taffy

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Taffy
          path: ${{ steps.build.outputs.zip }}
